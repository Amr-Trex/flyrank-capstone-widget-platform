services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "development"
      DATABASE_PATH: "/data/widget_platform.sqlite3"
      PUBLIC_BASE_URL: "http://localhost:8000"
      ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500"
      MAX_SUBMISSION_BYTES: "10000"
      GEO_MODE: "mock"
      EMAIL_MODE: "smtp"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SECURITY: "none"
      EMAIL_FROM: "widget-platform@example.local"
      NOTIFICATION_EMAIL: "owner@example.com"
      RATE_LIMIT_PER_MINUTE: "5"
    volumes:
      - api-data:/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  test-page:
    build: .
    entrypoint: []
    command:
      - python
      - -m
      - http.server
      - "5500"
      - --directory
      - test-page
    ports:
      - "5500:5500"
    depends_on:
      - api

volumes:
  api-data: